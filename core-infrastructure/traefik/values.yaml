deployment:
  podSecurityContext:
    fsGroup: 65532
  replicas: 1

ports:
  web:
    hostPort: 80
    redirectTo:
      port: websecure
  websecure:
    hostPort: 443
    tls:
      enabled: true
  minecraft:
    hostPort: 25565
    port: 25565
    protocol: TCP

service:
  type: ClusterIP

providers:
  kubernetesCRD:
    enabled: true
    allowCrossNamespace: true

