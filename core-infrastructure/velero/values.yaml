configuration:
  defaultVolumesToFsBackup: true
  backupStorageLocation:
    - name: default
      provider: velero.io/aws
      bucket: homelab-backup
      config:
        region: auto
        s3ForcePathStyle: true
        s3Url: https://ba7af738ac3fcf781135c6b598a7f096.r2.cloudflarestorage.com
  volumeSnapshotLocation: []


initContainers:
  - name: velero-plugin-for-aws
    image: velero/velero-plugin-for-aws:v1.11.1
    volumeMounts:
      - mountPath: /target
        name: plugins


deployNodeAgent: true

nodeAgent:
  containerSecurityContext:
    privileged: true

credentials:
  useSecret: true
  existingSecret: velero-s3-credentials

upgradeCRDs: false
kubectl:
  image:
    repository: bitnami/kubectl
    tag: latest


extraObjects:
  - apiVersion: v1
    kind: ConfigMap
    metadata:
      name: longhorn-volume-policy
      namespace: velero
    data:
      policies.yaml: |
        version: v1
        volumePolicies:
        # Match Longhorn and snapshot its data
        - conditions:
            storageClass:
              - longhorn
          action:
            type: snapshot # Change to 'fs-backup' if you aren't using CSI VolumeSnapshotClasses
        # Catch-all: skip data backup for all other storage classes
        - conditions: {}
          action:
            type: skip

schedules:
  media-pvc-backup:
    disabled: false
    schedule: "0 3 * * *" # Daily at 3 AM
    template:
      includedNamespaces:
        - media
      includedResources:
        - persistentvolumeclaims
        - persistentvolumes
      
      resourcePolicy:
        kind: configmap
        name: longhorn-volume-policy

