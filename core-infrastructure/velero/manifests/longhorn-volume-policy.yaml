---
apiVersion: v1
kind: ConfigMap
metadata:
  name: longhorn-volume-policy
  namespace: velero
data:
  policies.yaml: |
    version: v1
    volumePolicies:
    # Match Longhorn and snapshot its data
    - conditions:
        storageClass:
          - longhorn
      action:
        type: fs-backup
    # Catch-all: skip data backup for all other storage classes
    - conditions: {}
      action:
        type: skip
