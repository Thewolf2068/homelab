apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: game-servers
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  project: default
  source:
    repoURL: 'https://github.com/Thewolf2068/homelab.git'
    targetRevision: HEAD
    path: workloads/game-servers
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: game-servers
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
