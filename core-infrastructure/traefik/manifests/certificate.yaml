apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: wildcard-miquella-dev
  namespace: kube-system
spec:
  secretName: wildcard-miquella-tls
  issuerRef:
    name: letsencrypt-cloudflare
    kind: ClusterIssuer
  commonName: "*.miquella.dev"
  dnsNames:
    - "miquella.dev"
    - "*.miquella.dev"
