apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: hetzner-smb
provisioner: smb.csi.k8s.io
parameters:
  source: //u543033.your-storagebox.de/backup  # Your Hetzner SMB path
  csi.storage.k8s.io/node-stage-secret-name: hetzner-smb-creds
  csi.storage.k8s.io/node-stage-secret-namespace: kube-system
mountOptions:
  - dir_mode=0777
  - file_mode=0777
  - vers=3.0
reclaimPolicy: Delete
allowVolumeExpansion: true
