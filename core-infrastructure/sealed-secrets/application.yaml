apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: sealed-secrets
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  project: default
  source:
    repoURL: 'oci://registry-1.docker.io/bitnamicharts'
    chart: sealed-secrets
    targetRevision: 2.18.5 # Use the latest stable chart version
    helm:
      valueFiles:
        - $values/core-infrastructure/sealed-secrets/values.yaml
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: kube-system
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
