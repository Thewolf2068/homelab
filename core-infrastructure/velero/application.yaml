---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: velero
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  project: default
  sources:
    - repoURL: https://vmware-tanzu.github.io/helm-charts
      chart: velero
      targetRevision: "12.0.3"
      helm:
        valueFiles:
          - $repo/core-infrastructure/velero/values.yaml

    - repoURL: 'https://github.com/Thewolf2068/homelab.git'
      targetRevision: HEAD
      path: core-infrastructure/velero/manifests
      ref: repo
  destination:
    server: https://kubernetes.default.svc
    namespace: velero
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - SkipDryRunOnMissingResource=true
