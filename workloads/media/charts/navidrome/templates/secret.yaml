apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: navidrome-lastfm
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: navidrome-lastfm
    creationPolicy: Owner
  data:
    - secretKey: api-key
      remoteRef:
        key: navidrome-lastfm/api-key
    - secretKey: shared-secret
      remoteRef:
        key: navidrome-lastfm/shared-secret
