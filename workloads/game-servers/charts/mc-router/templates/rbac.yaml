apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ .Chart.Name }}-service-watcher
rules:
  - apiGroups: [""]
    resources: ["services"]
    verbs: ["watch", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ .Chart.Name }}-service-watcher
subjects:
  - kind: ServiceAccount
    name: {{ .Chart.Name }}
roleRef:
  kind: Role
  name: {{ .Chart.Name }}-service-watcher
  apiGroup: rbac.authorization.k8s.io
