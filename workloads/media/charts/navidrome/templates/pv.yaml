apiVersion: v1
kind: PersistentVolume
metadata:
  annotations:
    pv.kubernetes.io/provisioned-by: smb.csi.k8s.io
  name: pv-navidrome-smb
spec:
  capacity:
    storage: 50Gi
  accessMode:
    - ReadWriteMany
  persistentVolumeReclaimPolicy: Retain
  storageClassName: smb
  mountOptions:
    - dir_mode: 0777
    - file_mode: 0777
  csi:
    driver: smb.csi.k8s.io
    readOnly: false
    volumeHandle: navidrome
    volumeAttributes:
      source: "//u543033.your-storagebox.de/backup"
    nodeStageSecretRef:
      name: smbcreds
      namespace: kube-system
