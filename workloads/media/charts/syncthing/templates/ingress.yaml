apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: {{ .Chart.Name }}
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`{{ .Values.subdomain }}.miquella.dev`)
      kind: Rule
      services:
        - name: {{ .Chart.Name }}
          port: {{ .Values.port }}
  tls: {}
