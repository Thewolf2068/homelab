apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: velero-s3-credentials
  namespace: velero
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: velero-s3-credentials
    creationPolicy: Owner
  data:
    - secretKey: cloud
      remoteRef:
        key: cloudflare-r2-token/creds
