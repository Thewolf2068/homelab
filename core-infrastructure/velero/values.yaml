configuration:
  defaultVolumesToFsBackup: true
  backupStorageLocation:
    - name: default
      provider: velero.io/aws
      bucket: homelab-backup
      config:
        region: auto
        s3ForcePathStyle: true
        s3Url: https://ba7af738ac3fcf781135c6b598a7f096.r2.cloudflarestorage.com
  volumeSnapshotLocation: []

initContainers:
  - name: velero-plugin-for-aws
    image: velero/velero-plugin-for-aws:v1.14.2@sha256:0751144c1c8e52d52c48717fbd13ad5a3061e612ae4d7ad744a946cd5b139d1a
    volumeMounts:
      - mountPath: /target
        name: plugins


deployNodeAgent: true

nodeAgent:
  containerSecurityContext:
    privileged: true

credentials:
  useSecret: true
  existingSecret: velero-s3-credentials

upgradeCRDs: false
kubectl:
  image:
    repository: alpine/kubectl
    tag: 1.36.2@sha256:9b053116c5c9b746e466230ea3b8bd381757064ee483e236dbadcf7f798f73cf

schedules:
  media-pvc-backup:
    disabled: false
    schedule: "0 3 * * *" # Daily at 3 AM
    template:
      includedNamespaces:
        - media
      includedResources:
        - persistentvolumeclaims
        - persistentvolumes
        - pods
      
      resourcePolicy:
        kind: configmap
        name: longhorn-volume-policy

