apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: piraeus
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  project: default
  sources:
    - repoURL: 'ghcr.io/piraeusdatastore/piraeus-operator'
      targetRevision: 2.11.0
      chart: piraeus
      helm:
        releaseName: piraeus-operator
        valuesObject:
          installCRDs: true
    - repoURL: 'https://github.com/Thewolf2068/homelab.git'
      targetRevision: HEAD
      path: core-infrastructure/piraeus/manifests
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: piraeus-datastore
  syncPolicy:
    automated:
      selfHeal: true
      prune: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
