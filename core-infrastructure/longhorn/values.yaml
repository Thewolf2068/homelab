persistence:
  # The chart provides the `longhorn` StorageClass; don't mark it as cluster default.
  defaultClass: false
  defaultClassReplicaCount: 2

preUpgradeChecker:
  # The chart's pre-upgrade Job is mapped to an ArgoCD PreSync hook, which runs
  # before the ServiceAccount/RBAC it needs exist on a fresh install, so it hangs
  # and fails the whole sync. Longhorn recommends disabling it for GitOps.
  jobEnabled: false

defaultSettings:
  # Store replicas on the dedicated Talos user volume mounted at /var/mnt/longhorn
  # (see talconfig.yaml), not the small /var/lib/longhorn system/ephemeral partition.
  defaultDataPath: /var/mnt/longhorn
  defaultReplicaCount: "2"
